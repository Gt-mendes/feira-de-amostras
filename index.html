
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reino de Valdoria</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #2b1810 0%, #4a2c1a 50%, #1a0f08 100%);
    color: #f4e4c1;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(20, 12, 6, 0.85);
    border: 2px solid #b8860b;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  h1 {
    text-align: center;
    color: #ffd700;
    text-shadow: 2px 2px 4px #000;
    margin-top: 0;
  }
  .indicadores {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .indicador {
    background: rgba(184, 134, 11, 0.15);
    border: 1px solid #b8860b;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
  }
  .barra {
    background: #1a0f08;
    height: 8px;
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
  }
  .barra > div {
    height: 100%;
    background: linear-gradient(90deg, #ffd700, #b8860b);
    transition: width 0.4s ease;
  }
  .titulo-evento {
    color: #ffd700;
    font-size: 1.6em;
    margin-bottom: 12px;
  }
  .historia {
    background: rgba(0,0,0,0.3);
    padding: 18px;
    border-left: 4px solid #b8860b;
    border-radius: 4px;
    white-space: pre-wrap;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .botoes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  button {
    background: linear-gradient(180deg, #8b4513, #5a2d0c);
    color: #f4e4c1;
    border: 2px solid #b8860b;
    padding: 16px;
    font-size: 1em;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
  }
  .consequencias {
    text-align: center;
    margin-top: 16px;
    min-height: 24px;
    color: #ffd700;
    font-style: italic;
  }
  .tela-inicial, .tela-final {
    text-align: center;
  }
  .tela-final h2 {
    color: #ffd700;
    font-size: 2em;
  }
  .reinado {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 8px;
    line-height: 1.7;
    white-space: pre-wrap;
    margin: 20px 0;
  }
  @media (max-width: 600px) {
    .botoes { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const eventos = [
  {titulo:"A Grande Seca 🌾",historia:"Após a morte do antigo rei, Vossa Majestade assume o trono do reino de Valdoria. O povo deposita suas esperanças em sua liderança. Suas decisões determinarão se o reino entrará para a história como uma era de prosperidade ou de ruína.\nO destino de Valdoria está em suas mãos. 👑\n\nApós meses sem chuva, os campos do reino secaram. Os camponeses estão preocupados com a próxima colheita e pedem ajuda da coroa.\n\nComo Vossa Majestade deseja agir?",opcaoA:"Financiar novos poços e canais de irrigação",opcaoB:"Guardar o dinheiro do reino e esperar a próxima chuva",efeitoA:{popularidade:15,tesouro:-15,exercito:0,recursos:20},efeitoB:{popularidade:-20,tesouro:10,exercito:0,recursos:-15}},
  {titulo:"💰 O Pedido dos Mercadores",historia:"O porto de Aldoria é a principal rota comercial do reino. Navios carregados de especiarias, tecidos e metais preciosos chegam diariamente às docas. Entretanto, os comerciantes afirmam que os impostos cobrados pela Coroa se tornaram excessivos.\nRepresentantes das guildas mercantes comparecem ao salão do trono e fazem um ultimato: se nada mudar, levarão seus negócios para reinos rivais.\nO que o rei deseja fazer?",opcaoA:"Manter os impostos atuais",opcaoB:"Reduzir os impostos",efeitoA:{popularidade:-10,tesouro:15,exercito:0,recursos:-5},efeitoB:{popularidade:15,tesouro:-15,exercito:0,recursos:5}},
  {titulo:"⚔️ A Ameaça do Norte",historia:"Batedores retornam das fronteiras trazendo notícias preocupantes. O Reino de Nordheim vem treinando soldados em grande escala e movimentando tropas para regiões próximas à divisa.\nOs generais exigem reforços imediatos, enquanto diplomatas acreditam que uma guerra ainda pode ser evitada através de negociações.\nQual será a resposta da coroa?",opcaoA:"Reforçar o exército imediatamente",opcaoB:"Apostar na diplomacia e evitar gastos",efeitoA:{popularidade:5,tesouro:-15,exercito:20,recursos:-5},efeitoB:{popularidade:5,tesouro:5,exercito:-10,recursos:5}},
  {titulo:"🌲 O Bosque Sagrado",historia:"No coração de Valdoria existe uma floresta ancestral considerada sagrada por gerações. Recentemente, lenhadores descobriram uma enorme reserva de madeira de alta qualidade escondida entre suas árvores centenárias.\nA exploração poderia gerar riqueza e impulsionar a economia do reino, mas sacerdotes alertam que destruir a floresta pode enfurecer a população.\nO que os lenhadores devem fazer?",opcaoA:"Preservar a floresta",opcaoB:"Autorizar o corte das árvores",efeitoA:{popularidade:10,tesouro:-5,exercito:0,recursos:-10},efeitoB:{popularidade:-10,tesouro:15,exercito:0,recursos:10}},
  {titulo:"🏰 A Muralha de Drakmor",historia:"A cidade fronteiriça de Drakmor protege o reino contra invasões há décadas. Porém, suas muralhas estão envelhecidas e apresentam rachaduras perigosas.\nOs moradores e soldados pedem ajuda urgente para reconstruir as defesas. Em troca, prometem fortalecer a presença militar da região.\nO reino deve investir na construção?",opcaoA:"Construir a muralha",opcaoB:"Recusar o pedido de Drakmor",efeitoA:{popularidade:10,tesouro:-15,exercito:15,recursos:-5},efeitoB:{popularidade:-15,tesouro:10,exercito:-10,recursos:5}},
  {titulo:"🎭 Festival da Colheita",historia:"Após anos difíceis, a nobreza sugere organizar um grande Festival da Colheita. O evento reuniria artistas, músicos e comerciantes de todos os cantos do reino, elevando o moral da população.\nNo entanto, a celebração exigirá grandes gastos com segurança, alimentação e entretenimento.\nO rei aprova o evento?",opcaoA:"Economizar recursos",opcaoB:"Realizar o festival",efeitoA:{popularidade:-10,tesouro:5,exercito:0,recursos:10},efeitoB:{popularidade:20,tesouro:-15,exercito:0,recursos:-10}},
  {titulo:"🦠 A Praga Negra",historia:"Uma doença desconhecida começa a se espalhar pelas aldeias do sul. Inicialmente afetando apenas alguns moradores, ela rapidamente se transforma em uma ameaça para todo o reino.\nMédicos e curandeiros solicitam recursos para desenvolver tratamentos e montar hospitais improvisados. Os tesoureiros alertam que isso exigirá um grande investimento.\nComo agir?",opcaoA:"Financiar o tratamento dos doentes",opcaoB:"Manter os recursos do reino intactos",efeitoA:{popularidade:20,tesouro:-15,exercito:5,recursos:-10},efeitoB:{popularidade:-25,tesouro:10,exercito:-10,recursos:-10}},
  {titulo:"⛏️ A Mina de Prata",historia:"Exploradores retornam das montanhas carregando amostras de prata pura. Segundo eles, uma enorme jazida foi descoberta em território real.\nA mina poderá enriquecer Valdoria durante décadas, mas exigirá milhares de trabalhadores e investimentos pesados em infraestrutura.\nO rei deve investir na mineração?",opcaoA:"Abrir a mina",opcaoB:"Deixar a montanha intocada",efeitoA:{popularidade:0,tesouro:20,exercito:-5,recursos:-10},efeitoB:{popularidade:5,tesouro:0,exercito:0,recursos:5}},
  {titulo:"🛡️ Os Cavaleiros Reais",historia:"As estradas do reino tornaram-se perigosas. Mercadores relatam ataques constantes de bandidos e caravanas desaparecem sem deixar rastros.\nO comandante militar propõe criar uma nova Ordem dos Cavaleiros Reais, uma tropa de elite responsável por proteger as rotas comerciais.\nO pedido será atendido?",opcaoA:"Treinar novos cavaleiros",opcaoB:"Manter o exército atual",efeitoA:{popularidade:5,tesouro:-10,exercito:20,recursos:-10},efeitoB:{popularidade:-5,tesouro:5,exercito:-10,recursos:5}},
  {titulo:"👑 O Casamento Real",historia:"Uma das famílias mais influentes dos reinos vizinhos oferece uma aliança através de um casamento real. A união poderá fortalecer relações diplomáticas, aumentar a segurança das fronteiras e abrir novas oportunidades comerciais.\nEntretanto, a cerimônia exigirá um investimento gigantesco e poderá gerar críticas entre os nobres locais.\nQual será a decisão de Vossa Majestade?",opcaoA:"Aceitar a aliança",opcaoB:"Recusar a proposta e combater o reino",efeitoA:{popularidade:10,tesouro:-15,exercito:10,recursos:0},efeitoB:{popularidade:-10,tesouro:5,exercito:-5,recursos:0}},
  {titulo:"💀 O Fim do Reinado",historia:"Décadas se passaram desde sua coroação. Seus cabelos tornaram-se grisalhos e a idade já pesa sobre seus ombros. O povo reconhece suas conquistas, mas agora surge a questão que definirá o futuro de Valdoria após sua partida.\nOs conselheiros exigem que o rei determine quem governará quando seu tempo chegar ao fim.\nQual deve ser a última decisão do atual Rei de Valdoria?",opcaoA:"Passar a coroa para seu filho mais velho",opcaoB:"Se recusar a largar o trono e deixar a população escolher após a sua morte",efeitoA:{popularidade:10,tesouro:0,exercito:5,recursos:0},efeitoB:{popularidade:-15,tesouro:0,exercito:-10,recursos:0}}
];

const state = {
  popularidade: 50,
  tesouro: 50,
  exercito: 50,
  recursos: 50,
  eventoAtual: 0,
  ultimoEfeito: null,
  tela: "inicial"
};

const app = document.getElementById("app");
const clamp = v => Math.max(0, Math.min(100, v));

function render() {
  if (state.tela === "inicial") return renderInicial();
  if (state.tela === "jogo") return renderJogo();
  if (state.tela === "final") return renderFinal();
}

function renderInicial() {
  app.innerHTML = `
    <div class="tela-inicial">
      <h1>👑 Reino de Valdoria</h1>
      <p style="font-size:1.1em;line-height:1.6;">
        Vossa Majestade está prestes a assumir o trono.<br>
        Cada decisão moldará o destino do reino.<br>
        Será sua era de ouro... ou de ruína?
      </p>
      <button id="iniciar" style="margin-top:20px;padding:18px 40px;font-size:1.2em;">Iniciar Reinado</button>
    </div>`;
  document.getElementById("iniciar").onclick = () => { state.tela = "jogo"; render(); };
}

function renderJogo() {
  const e = eventos[state.eventoAtual];
  const ind = [
    ["👑 Popularidade", state.popularidade],
    ["💰 Tesouro", state.tesouro],
    ["⚔️ Exército", state.exercito],
    ["🌾 Recursos", state.recursos]
  ];
  const cons = state.ultimoEfeito ? consequenciasTxt(state.ultimoEfeito) : "";
  app.innerHTML = `
    <h1>Reino de Valdoria — Evento ${state.eventoAtual + 1}/${eventos.length}</h1>
    <div class="indicadores">
      ${ind.map(([n,v]) => `<div class="indicador">${n}: ${v}%<div class="barra"><div style="width:${v}%"></div></div></div>`).join("")}
    </div>
    <div class="titulo-evento">${e.titulo}</div>
    <div class="historia">${e.historia}</div>
    <div class="botoes">
      <button id="a">${e.opcaoA}</button>
      <button id="b">${e.opcaoB}</button>
    </div>
    <div class="consequencias">${cons}</div>`;
  document.getElementById("a").onclick = () => escolher("efeitoA");
  document.getElementById("b").onclick = () => escolher("efeitoB");
}

function consequenciasTxt(ef) {
  let m = "📜 Consequências da última decisão:";
  const map = {popularidade:"👑",tesouro:"💰",exercito:"⚔️",recursos:"🌾"};
  for (const k in ef) if (ef[k] !== 0) m += ` ${map[k]} ${ef[k] > 0 ? "+" : ""}${ef[k]}`;
  return m;
}

function escolher(key) {
  const ef = eventos[state.eventoAtual][key];
  state.popularidade = clamp(state.popularidade + ef.popularidade);
  state.tesouro = clamp(state.tesouro + ef.tesouro);
  state.exercito = clamp(state.exercito + ef.exercito);
  state.recursos = clamp(state.recursos + ef.recursos);
  state.ultimoEfeito = ef;
  state.eventoAtual++;
  if (state.eventoAtual >= eventos.length) state.tela = "final";
  render();
}

function renderFinal() {
  const p = state.popularidade + state.tesouro + state.exercito + state.recursos;
  let titulo, historia;
  if (p < 170) titulo = "💀 Reino em Ruína";
  else if (p < 230) titulo = "⚔️ Reino Estável";
  else if (p < 250) titulo = "🏰 Reino Próspero";
  else titulo = "👑 Era de Ouro de Valdoria";

  if (p < 170) historia = "O Crepúsculo de Valdoria\n\nAo final de seu reinado, Valdoria encontrava-se enfraquecida por crises sucessivas. Os celeiros estavam vazios, os cofres reais quase sem ouro e a confiança do povo havia desaparecido. Após sua morte, muitos se perguntaram onde as coisas começaram a dar errado. Seu nome permaneceu nos livros de história, mas como um alerta para os futuros governantes.";
  else if (p < 230) historia = "O Guardião do Reino\n\nDurante seu governo, Valdoria manteve a ordem e a segurança. O reino não viveu uma era de grande esplendor, mas também não sofreu grandes tragédias. Seu legado foi o de um governante equilibrado, capaz de conduzir seu povo por tempos difíceis sem permitir que o reino desmoronasse.";
  else if (p < 250) historia = "A Era da Prosperidade\n\nSob sua liderança, cidades cresceram, mercados floresceram e as fronteiras permaneceram seguras. O povo viveu anos de relativa abundância e os nobres reconheceram sua capacidade de governar. Seu nome tornou-se sinônimo de competência e progresso, sendo lembrado com respeito por gerações.";
  else historia = "O Rei Lendário\n\nSeu reinado transformou Valdoria em um dos maiores reinos de sua época. A riqueza encheu os cofres, o exército tornou-se temido por seus inimigos e o povo prosperou sob sua proteção. Séculos depois, bardos ainda cantam suas conquistas e monumentos erguidos em sua homenagem permanecem de pé. Seu nome entrou para a eternidade como o maior governante da história de Valdoria.";

  app.innerHTML = `
    <div class="tela-final">
      <h1>Fim do Reinado</h1>
      <h2>${titulo}</h2>
      <div class="indicadores">
        <div class="indicador">👑 Popularidade: ${state.popularidade}%</div>
        <div class="indicador">💰 Tesouro: ${state.tesouro}%</div>
        <div class="indicador">⚔️ Exército: ${state.exercito}%</div>
        <div class="indicador">🌾 Recursos: ${state.recursos}%</div>
      </div>
      <div class="reinado">${historia}</div>
      <button id="reset" style="padding:16px 32px;font-size:1.1em;">Iniciar Novo Reinado</button>
    </div>`;
  document.getElementById("reset").onclick = () => {
    Object.assign(state, {popularidade:70,tesouro:50,exercito:50,recursos:70,eventoAtual:0,ultimoEfeito:null,tela:"inicial"});
    render();
  };
}

render();
</script>
</body>
</html>
